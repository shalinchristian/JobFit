services:
  python-service:
    build: ./PythonService
    ports:
      - "5001:5001"

  resume-api:
    build: ./ResumeAPI
    ports:
      - "5000:5000"  
    depends_on:
      - python-service
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - PythonService__BaseUrl=http://python-service:5001
